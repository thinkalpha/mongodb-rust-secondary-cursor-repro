services:
  mongo1:
    image: mongo:9.0.4
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [repro]
  mongo2:
    image: mongo:9.0.4
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [repro]
  repro:
    image: rust:1.98.1-bookworm
    working_dir: /work
    volumes: [".:/work", "cargo-cache:/usr/local/cargo/registry", "target-cache:/work/target"]
    command: ["cargo", "run", "--locked"]
    networks: [repro]
networks:
  repro:
    driver: bridge
volumes:
  cargo-cache:
  target-cache:
